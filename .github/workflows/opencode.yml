name: OpenCode mit Ollama

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request:
    types: [opened, synchronize, ready_for_review]
  push:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      model:
        description: 'Ollama Modell auswählen'
        required: true
        default: 'qwen-coder:latest'
        type: choice
        options:
          - dolphin:latest
          - qwenkimi:latest
          - qwen25:latest
          - qwen-opt:latest
          - unholy:latest
          - pentest-assistant:latest
          - qwen-codex:latest
          - qwen-coder:latest
          - mythos-q4:latest
          - qwen-highiq:latest
          - nomic-embed-text:latest
      opencode_command:
        description: 'OpenCode Befehl'
        required: false
        default: 'analyze --verbose'
        type: string

jobs:
  opencode:
    if: |
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'pull_request' ||
      github.event_name == 'push' ||
      contains(github.event.comment.body, '/oc') ||
      contains(github.event.comment.body, '/opencode')
    
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
      pull-requests: write
      issues: write
      packages: write
    
    strategy:
      matrix:
        model: 
          - dolphin:latest
          - qwenkimi:latest
          - qwen25:latest
          - qwen-opt:latest
          - unholy:latest
          - pentest-assistant:latest
          - qwen-codex:latest
          - qwen-coder:latest
          - mythos-q4:latest
          - qwen-highiq:latest
          - nomic-embed-text:latest
      fail-fast: false

    steps:
      - name: 🧹 Cleanup Runner
        run: |
          sudo rm -rf /opt/hostedtoolcache
          df -h

      - name: 📥 Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 📦 Install Python dependencies
        run: |
          pip install --upgrade pip
          pip install requests aiohttp

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: 📦 Install OpenCode
        run: |
          npm install -g opencode

      - name: 🦙 Install Ollama
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          ollama serve &
          sleep 10
          ollama list

      - name: 🦙 Pull Model: ${{ matrix.model }}
        run: |
          echo "🔄 Lade Modell: ${{ matrix.model }}..."
          ollama pull ${{ matrix.model }}
          echo "✅ Modell geladen: ${{ matrix.model }}"
          ollama list

      - name: 📝 Create OpenCode Config
        run: |
          cat > opencode.json << 'EOF'
          {
            "$schema": "https://opencode.ai/config.json",
            "mcp": {
              "context7": {
                "type": "remote",
                "url": "https://mcp.context7.com/mcp",
                "headers": {
                  "X-API-Key": "${{ secrets.CONTEXT7_KEY }}"
                },
                "enabled": true
              },
              "github": {
                "type": "stdio",
                "command": "npx",
                "args": ["-y", "@modelcontextprotocol/server-github"],
                "env": {
                  "GITHUB_PERSONAL_ACCESS_TOKEN": "${{ secrets.GH_PAT }}"
                },
                "enabled": false
              }
            },
            "model": {
              "provider": "ollama",
              "name": "${{ matrix.model }}",
              "baseUrl": "http://localhost:11434",
              "options": {
                "temperature": 0.7,
                "top_p": 0.9,
                "num_predict": 2048
              }
            }
          }
          EOF

      - name: 🧪 Test Model: ${{ matrix.model }}
        run: |
          echo "🔍 Teste Modell: ${{ matrix.model }}..."
          curl -X POST http://localhost:11434/api/generate \
            -d "{\"model\": \"${{ matrix.model }}\", \"prompt\": \"Say hello\", \"stream\": false}" \
            | jq .response

      - name: 🤖 Run OpenCode with ${{ matrix.model }}
        id: opencode_run
        env:
          CONTEXT7_KEY: ${{ secrets.CONTEXT7_KEY }}
          GH_PAT: ${{ secrets.GH_PAT }}
          OPENCODE_MODEL: ${{ matrix.model }}
          OLLAMA_HOST: "http://localhost:11434"
        continue-on-error: true
        run: |
          echo "🚀 Starte OpenCode mit ${{ matrix.model }}..."
          
          # Sammle alle relevanten Dateien
          FILES=$(find . -type f \( -name "*.py" -o -name "*.js" -o -name "*.ts" -o -name "*.json" -o -name "*.md" \) | head -20)
          
          if [ -n "$FILES" ]; then
            echo "📄 Analysiere Dateien:"
            echo "$FILES"
            
            # Führe OpenCode aus
            opencode analyze \
              --files $FILES \
              --format json \
              --output "results-${{ matrix.model }}.json" \
              --verbose || echo "⚠️ OpenCode Analyse fehlgeschlagen"
          else
            echo "ℹ️ Keine Dateien zum Analysieren gefunden"
            echo '{"status": "no_files", "message": "Keine Dateien zum Analysieren"}' > "results-${{ matrix.model }}.json"
          fi

      - name: 📊 Save Results
        if: always()
        run: |
          mkdir -p opencode-results
          cp results-*.json opencode-results/ 2>/dev/null || echo "Keine Ergebnisse gefunden"
          
          echo "Modell: ${{ matrix.model }}" > opencode-results/model-info.txt
          echo "Zeit: $(date)" >> opencode-results/model-info.txt
          echo "Status: ${{ steps.opencode_run.outcome }}" >> opencode-results/model-info.txt

      - name: 📤 Upload Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: opencode-results-${{ matrix.model }}
          path: |
            opencode-results/
            results-*.json
            opencode.json

      - name: 📊 Create Summary
        if: always()
        run: |
          cat > summary.md << 'EOF'
          ## 🤖 OpenCode Analyse - ${{ matrix.model }}
          
          | Eigenschaft | Wert |
          |------------|------|
          | **Modell** | ${{ matrix.model }} |
          | **Status** | ${{ steps.opencode_run.outcome }} |
          | **Zeit** | $(date) |
          
          ### 📄 Ergebnisse
          
          EOF
          
          if [ -f "results-${{ matrix.model }}.json" ]; then
            echo '```json' >> summary.md
            cat "results-${{ matrix.model }}.json" | jq . >> summary.md 2>/dev/null || cat "results-${{ matrix.model }}.json" >> summary.md
            echo '```' >> summary.md
          else
            echo "❌ Keine Ergebnisse verfügbar" >> summary.md
          fi
          
          cat summary.md >> $GITHUB_STEP_SUMMARY

      - name: 💬 Comment on PR/Issue
        if: always() && (github.event_name == 'pull_request' || github.event_name == 'issue_comment')
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GH_PAT }}
          script: |
            const fs = require('fs');
            const model = '${{ matrix.model }}';
            
            try {
              const output = fs.readFileSync(`results-${model}.json`, 'utf8');
              const summary = fs.readFileSync('summary.md', 'utf8');
              
              const comment = `## 🤖 OpenCode Analyse mit \`${model}\`\n\n${summary}`;
              
              const issue_number = context.payload.issue?.number || 
                                  context.payload.pull_request?.number ||
                                  context.payload.number;
              
              if (issue_number) {
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issue_number,
                  body: comment
                });
              }
            } catch (error) {
              console.log('⚠️ Konnte keinen Kommentar erstellen:', error.message);
            }

      - name: 🧹 Cleanup
        if: always()
        run: |
          ollama stop ${{ matrix.model }} || true
          rm -rf results-*.json
